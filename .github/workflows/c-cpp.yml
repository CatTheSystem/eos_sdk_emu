name: Build EOS SDK Emulator

on:
  push:
    branches: [ "partyvan" ]
  pull_request:
    branches: [ "partyvan" ]
  workflow_dispatch: # Allows you to manually trigger a build from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -S . -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Compiled Emulator
      uses: actions/upload-artifact@v4
      with:
        name: eossdk-win64-shipping
        path: build/Release/*.dll
